plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mopick'
version = '0.0.1-SNAPSHOT'
description = 'MOPICK backend - AI StyleSpec & Evidence Match'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

ext {
    springAiVersion = '2.0.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // vision + structured output. 둘 다 올려두고 spring.ai.model.chat으로 하나만 활성화한다.
    // 측정 결과 정확도·안정성은 Gemini가 앞서고, OpenAI는 쿼터가 넉넉하다. 상황에 따라 고른다.
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // 얼굴 파싱 모델을 JVM 안에서 돌린다. 사이드카 없이 단일 프로세스로 끝난다.
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.20.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
